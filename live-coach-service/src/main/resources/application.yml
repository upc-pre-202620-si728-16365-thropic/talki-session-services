spring:
  application:
    name: live-coach-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8083}

gemini:
  # API key de Google AI Studio. NUNCA se commitea: se inyecta por entorno.
  # Sin ella, POST /v1/coach/live-token responde 503 (el resto del servicio funciona).
  api-key: ${GEMINI_API_KEY:}
  # Modelo de la Live API (id sin prefijo "models/"). Debe soportar bidiGenerateContent.
  model: ${GEMINI_MODEL:gemini-2.5-flash-native-audio-latest}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  # Vigencia del token efímero y ventana para abrir la primera sesión (segundos).
  token-ttl-seconds: ${GEMINI_TOKEN_TTL_SECONDS:1800}
  session-ttl-seconds: ${GEMINI_SESSION_TTL_SECONDS:120}
  max-session-minutes: ${GEMINI_MAX_SESSION_MINUTES:15}

logging:
  level:
    com.thropic.talki: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
